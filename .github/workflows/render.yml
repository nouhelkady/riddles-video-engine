name: Render riddles video

on:
  workflow_dispatch:
    inputs:
      episode_file_id:
        description: Google Drive file id of episode.json (shared with anyone with the link)
        required: true
        type: string
      release_tag:
        description: Tag of the release that will hold the video (chosen by n8n so it knows the video link)
        required: true
        type: string
      episode_name:
        description: Name used for the release title
        required: false
        default: episode
        type: string
      resumeUrl:
        description: n8n resume webhook, called when the render ends
        required: false
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.release_tag }}
      EPISODE_FILE_ID: ${{ inputs.episode_file_id }}
      RESUME_URL: ${{ inputs.resumeUrl }}
      EPISODE_NAME: ${{ inputs.episode_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install emoji font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji

      - name: Install packages
        run: npm ci --no-audit --no-fund

      - name: Download episode and pictures
        run: node scripts/fetch-episode.mjs "$EPISODE_FILE_ID"

      - name: Render video
        run: |
          BROWSER="$(which google-chrome || true)"
          if [ -n "$BROWSER" ]; then BROWSER_FLAG="--browser-executable=$BROWSER"; else npx remotion browser ensure; BROWSER_FLAG=""; fi
          npx remotion render src/index.ts Episode out/video.mp4 \
            --props=public/episode/episode.json \
            --concurrency=100% --crf=23 --timeout=120000 $BROWSER_FLAG

      - name: Publish video
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/video.mp4 --title "$EPISODE_NAME" --notes "Rendered automatically ($RUN_URL)"

      - name: Tell n8n the render ended
        if: always() && inputs.resumeUrl != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$RESUME_URL" in *\?*) SEP='&' ;; *) SEP='?' ;; esac
          URL="${RESUME_URL}${SEP}status=${JOB_STATUS}"
          if curl -sS -m 60 --fail -o /dev/null "$URL"; then
            echo "n8n resumed (GET)"
          elif curl -sS -m 60 --fail -o /dev/null -X POST -H 'Content-Type: application/json' -d "{\"status\":\"$JOB_STATUS\"}" "$URL"; then
            echo "n8n resumed (POST)"
          else
            echo "::warning::Could not resume the n8n execution"
          fi
